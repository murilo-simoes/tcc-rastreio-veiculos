# Drop-in do systemd que liga o detector de placas treinado pelo grupo.
# Instalação no Pi:
#   sudo mkdir -p /etc/systemd/system/rastreio-iot.service.d
#   sudo cp rastreio-iot-detector.conf /etc/systemd/system/rastreio-iot.service.d/detector.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rastreio-iot
#
# Os pesos (ajuste fino YOLOv8n no RodoSol-ALPR, exportados para NCNN com
# entrada 384x640) NÃO são versionados: o acordo de uso do RodoSol-ALPR não
# permite redistribuir dados derivados. Exportação usada:
#   yolo export model=best.pt format=ncnn imgsz=384,640
# Sem MODELO_YOLO_PLACA o serviço volta ao pipeline antigo (YOLO genérico).
[Service]
Environment=MODELO_YOLO_PLACA=/home/murilo/modelos_tcc/placa_384x640/best_ncnn_model
Environment=CONFIANCA_MIN_PLACA=0.50
Environment=IMGSZ_PLACA=384,640
# Leitor de caracteres: fast_plate_ocr (padrão) ou easyocr
# Environment=MOTOR_OCR=fast_plate_ocr
